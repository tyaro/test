<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>箱庭双六 🎲 - Babylon.js</title>
  <style>
    /* ── リセット & ベース ──────────────────────────────── */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0e0e1a;
      color: #f0f0ff;
      font-family: 'Segoe UI', 'Noto Sans JP', sans-serif;
      overflow: hidden;
    }

    /* ── 3D キャンバス ───────────────────────────────────── */
    #renderCanvas {
      width: 100vw;
      height: 100vh;
      display: block;
      touch-action: none; /* Babylon.js タッチ操作のため */
    }

    /* ── タイトルバー ────────────────────────────────────── */
    #title-bar {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 10, 30, 0.82);
      border: 1px solid rgba(140, 100, 255, 0.4);
      border-radius: 12px;
      padding: 8px 24px;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 0.05em;
      backdrop-filter: blur(10px);
      white-space: nowrap;
    }

    /* ── 操作パネル ──────────────────────────────────────── */
    #ui-overlay {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(10, 10, 30, 0.85);
      border: 1px solid rgba(140, 100, 255, 0.35);
      border-radius: 16px;
      padding: 14px 24px;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 32px rgba(0, 0, 0, 0.5);
    }

    /* サイコロボタン */
    #rollButton {
      background: linear-gradient(135deg, #6c63ff, #a855f7);
      color: #fff;
      border: none;
      padding: 12px 32px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.12s, opacity 0.2s;
      box-shadow: 0 2px 14px rgba(108, 99, 255, 0.45);
      letter-spacing: 0.04em;
    }

    #rollButton:hover:not(:disabled) {
      transform: scale(1.06);
      box-shadow: 0 4px 20px rgba(168, 85, 247, 0.6);
    }

    #rollButton:active:not(:disabled) {
      transform: scale(0.97);
    }

    #rollButton:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* 結果テキストエリア */
    #info-panel {
      min-width: 220px;
    }

    #result {
      font-size: 15px;
      color: #dde0ff;
      margin-bottom: 4px;
    }

    #status {
      font-size: 13px;
      color: #9090bb;
    }

    /* ── 凡例 ────────────────────────────────────────────── */
    #legend {
      position: fixed;
      top: 70px;
      right: 20px;
      background: rgba(10, 10, 30, 0.82);
      border: 1px solid rgba(140, 100, 255, 0.3);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 12px;
      line-height: 1.9;
      backdrop-filter: blur(8px);
    }

    #legend h3 {
      font-size: 12px;
      font-weight: bold;
      color: #aaa;
      margin-bottom: 4px;
      text-align: center;
      letter-spacing: 0.06em;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .swatch {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    /* ── カメラ操作ヒント ────────────────────────────────── */
    #hint {
      position: fixed;
      top: 70px;
      left: 20px;
      background: rgba(10, 10, 30, 0.75);
      border: 1px solid rgba(140, 100, 255, 0.25);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 11px;
      color: #888;
      line-height: 1.8;
      backdrop-filter: blur(6px);
    }
  </style>
</head>
<body>

  <!-- 3D シーン描画キャンバス -->
  <canvas id="renderCanvas"></canvas>

  <!-- タイトルバー -->
  <div id="title-bar">🏡 箱庭双六 — Babylon.js プロトタイプ</div>

  <!-- 操作パネル -->
  <div id="ui-overlay">
    <button id="rollButton">🎲 サイコロを振る</button>
    <div id="info-panel">
      <div id="result">ゲームを開始してください</div>
      <div id="status">マス: 0 / 19</div>
    </div>
  </div>

  <!-- 凡例 -->
  <div id="legend">
    <h3>マスの種類</h3>
    <div class="legend-item">
      <div class="swatch" style="background:#40d940;"></div>
      <span>スタート</span>
    </div>
    <div class="legend-item">
      <div class="swatch" style="background:#ffd900;"></div>
      <span>ボーナス（進む）</span>
    </div>
    <div class="legend-item">
      <div class="swatch" style="background:#ff4040;"></div>
      <span>罰則（戻る）</span>
    </div>
    <div class="legend-item">
      <div class="swatch" style="background:#ff8800;"></div>
      <span>ゴール</span>
    </div>
    <div class="legend-item">
      <div class="swatch" style="background:#8bc8ff;"></div>
      <span>通常マス</span>
    </div>
  </div>

  <!-- カメラ操作ヒント -->
  <div id="hint">
    🖱 ドラッグ: カメラ回転<br>
    🖱 右ドラッグ / 2本指: パン<br>
    🖱 ホイール: ズーム
  </div>

  <!-- ライブラリ（Babylon.js & Cannon.js — CDN） -->
  <script src="https://cdn.babylonjs.com/cannon.js"></script>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>

  <!-- アプリケーションコード -->
  <script src="../src/utils.js"></script>
  <script src="../src/app.js"></script>

</body>
</html>
